services:
  postgres:
    image: postgres:16-alpine
    container_name: library_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: library_user
      POSTGRES_PASSWORD: library_secret_pw
      POSTGRES_DB: library_front_office
    ports:
      - "5434:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library_user -d library_front_office"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: library_front_office_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://library_user:library_secret_pw@postgres:5432/library_front_office
      NODE_ENV: production
    volumes:
      - ./signatures:/app/signatures
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
